##################
### FILE PATHS ###
##################
model_dir: exp_deeplab_v4
checkpoint_file: checkpoint.pth.tar

data_path: "amazon_data/13_amazon_data_v4"

note: >
  v4 — Crop fixo de 512 e input_dimension fixo de 512, sem variação de escala.
  Motivação: eliminar completamente o mismatch treino-teste ao usar crop e entrada
  com o mesmo tamanho fixo (512×512), sem multi-scale. Demais hiperparâmetros
  iguais à v3: batch_norm=true, batch_size=32, pretrained, lambda_weight=1,
  dropout=0.5, overlap=[0.3, 0.5].

num_regions: 1
ortho_images:
  - "amazon_data/amazon_input_data/orthoimage/NOV_2017_FINAL_004.tif"

train_segmentation_paths:
  - "amazon_data/amazon_input_data/segmentation/train_set.tif"

test_segmentation_paths:
  - "amazon_data/amazon_input_data/segmentation/test_set.tif"

full_segmentation_paths:
  - "amazon_data/amazon_input_data/segmentation/full_set.tif"

mask_paths:
  - "amazon_data/amazon_input_data/mask.tif"

validation_set: "train"

#################################
###### TRAINING parameters ######
#################################
downsampling_factor: None
samples: 5000
augment: True
copy_and_paste_augmentation: False

arch: deeplabv3_resnet50
is_pretrained: True
batch_norm: true
dropout_rate: 0.5
lambda_weight: 1

### optim parameters ###
epochs: 30
batch_size: 32
base_lr: 0.01
final_lr: 0.0001
warmup_epochs: 5
start_warmup: 0.0
weight_decay: 1e-06

### others parameters ###
workers: 4
seed: 3115

###############################
#### Crop / Input settings ####
###############################

# Size of crops extracted from the image (can be large, e.g., 1024)
size_crops: 512

# Size of the input to the model (fixed, e.g., 256)
# The crops are resized to this dimension before being fed to the model
# Output is then resized back to size_crops
input_dimension: 512

###############################
#### Multi-scale crop settings ####
###############################

# Sem variação de escala: min == max == size_crops
min_crop_size: 512
max_crop_size: 512

# Crop fixo para avaliação/inferência
eval_crop_size: 512

nb_class: 17
overlap: [0.3, 0.5]

################################
## Active Learning parameters ##
################################
prob_thr: 0.7
depth_thr: 0.5

num_iter: 20

lower_limit_area: 10
upper_limit_area: "inf"

lower_limit_area_rlted_to_tree_type: -0.3
upper_limit_area_rlted_to_tree_type: 0.7
lower_limit_solidity_rlted_to_tree_type: -0.5

scale_area: None
sigma: 30
