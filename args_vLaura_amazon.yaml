##################
### FILE PATHS ###
##################
# experiment directory (saved inside each iter folder)
model_dir: exp_vLaura_deeplabvlaura_resnet50_amazon

checkpoint_file: checkpoint.pth.tar

# Root folder where iterations/outputs will be created (versão 50k samples)
data_path: "amazon_data/vLaura_deeplabvlaura_v4_512"

note: "Experimento vLaura v4 - DeepLabVLaura com encoder ResNet-50 (pre-activation, ELU) e dropout 0.65 no amazon_data, 5000 samples por época"

# Input data for the model

# Single-region config (Amazon)
ortho_images:
  - "amazon_data/amazon_input_data/orthoimage/NOV_2017_FINAL_004.tif"

train_segmentation_paths:
  - "amazon_data/amazon_input_data/segmentation/train_set.tif"

test_segmentation_paths:
  - "amazon_data/amazon_input_data/segmentation/test_set.tif"

# Full segmentation (train + test combined) - using train as fallback if not available
full_segmentation_paths:
  - "amazon_data/amazon_input_data/segmentation/train_set.tif"

# Optional mask (used by sample selection); if missing, it will be auto-generated
mask_paths:
  - "amazon_data/amazon_input_data/mask.tif"

# You can use the 'test', 'train' or 'full' set as validation set
validation_set: "train"

#################################
###### TRAINING parameters ######
downsampling_factor: None
# num samples per epoch (aumentado para 50.000)
samples: 5000
# True for data augmentation during training
augment: True
copy_and_paste_augmentation: False
# convnet architecture --> DeepLabVLaura com encoder ResNet-50 (mesmo padrão pre-activation/ELU do paper)
arch: deeplabvlaura_resnet50
# True for load pretrained weights from Imagenet (não aplicável para esta arquitetura)
is_pretrained: False
batch_norm: true
# Dropout rate for deepvlab classification training
dropout_rate: 0.65

# regularization weight of distance map
lambda_weight: 1

### optim parameters ###
# number of total epochs to run
epochs: 100
# batch size per gpu, i.e. how many unique instances per gpu
# NOTA: ResNet-50 encoder usa downsampling /32, gerando feature maps menores na memória.
# Amazon tem 17 classes (vs 4 do bioflore), exigindo mais VRAM.
# GPU 16GB: batch_size 4 for input_dimension 256 (resnet50 encoder, 17 classes)
# GPU 16GB: batch_size 2 for input_dimension 512 (resnet50 encoder, 17 classes)
batch_size: 4

# Gradient accumulation: acumula gradientes por N passos antes de atualizar os pesos,
# simulando um batch_size efetivo de batch_size * gradient_accumulation_steps.
# Exemplo: batch_size=4, gradient_accumulation_steps=8 → effective_batch_size=32 (igual ao anterior)
gradient_accumulation_steps: 8

# Evaluation batch size (se não especificado, cai para batch_size acima)
# Manter menor na avaliação evita estouro de memória (CUDA OOM)
eval_batch_size: 16

# base learning rate
base_lr: 0.1
# final learning rate
final_lr: 0.0001
# number of warmup epochs
warmup_epochs: 5
# initial warmup learning rate
start_warmup: 0.0

# weight decay
weight_decay: 1e-06

# Early stopping patience: number of epochs without improvement before stopping
patience: 5

# Learning rate schedule: "cosine_warmup" or "step_decay"
# "step_decay" multiplies lr by step_decay_rate every step_decay_every epochs
# (inverse time decay as in Cué La Rosa et al., 2021)
lr_schedule_type: step_decay
step_decay_rate: 0.1
step_decay_every: 5

### others parameters ###
# number of data loading workers
workers: 4
# random seed
seed: 3115

###############################
#### Evaluation parameters ####
###############################

# Size of crops extracted from the image (can be large, e.g., 1024)
size_crops: 512

# Size of the input to the model (must be divisible by 4)
input_dimension: 512

###############################
#### Multi-scale crop settings ####
###############################

# During training, crop size is sampled uniformly between min and max
# Set min_crop_size = max_crop_size to disable multi-scale
min_crop_size: 512      # Minimum crop size (pixels)
max_crop_size: 512     # Maximum crop size (pixels)

# Fixed crop size for evaluation/validation
eval_crop_size: 512

# Amazon classes (labels 1..17)
nb_class: 17

# samples per epoch
overlap: [0.3, 0.5]

################################
## Active Learning parameters ##
################################

# probability and distance map threshold to filter new components
prob_thr: 0.7
depth_thr: 0.5

# Num of iter - CONFIGURADO PARA 1 ITERAÇÃO APENAS
num_iter: 1

# Area filter thresholds in square meters (m²)
# Valores baseados nos experimentos antigos do Amazon (ex.: 13_amazon_data / 15_amazon_data)
lower_limit_area: 25000
upper_limit_area: "inf"

lower_limit_area_rlted_to_tree_type: -0.3
upper_limit_area_rlted_to_tree_type: 0.7
lower_limit_solidity_rlted_to_tree_type: -0.5

# Available scales: "log", None
scale_area: None

# Sigma value for gaussian filter in distance map
sigma: 30
